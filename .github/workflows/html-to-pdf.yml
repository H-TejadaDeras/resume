name: Export Resume
# Made by Microsoft Copilot 05-16-2026

on:
  push:
    # branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Convert HTML to PDF (no margins)
        run: |
          HTML_PATH="${GITHUB_WORKSPACE}/resume.html"
          PDF_PATH="${GITHUB_WORKSPACE}/resume.pdf"  

          wkhtmltopdf \
            -T 0 -B 0 -L 0 -R 0 \
            "$HTML_PATH" \
            "$PDF_PATH"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: ${{ github.event.repository.name }}/resume.pdf
